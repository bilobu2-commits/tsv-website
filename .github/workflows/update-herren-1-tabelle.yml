name: Herren-1-Tabelle aktualisieren

# Kein automatischer Zeitplan - die Tabelle muss nicht live sein.
# Über den "Run workflow"-Button im Actions-Tab manuell auslösen, wenn sie aktualisiert werden soll.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-tabelle:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tabelle von volleyball.bayern abrufen
        run: node scripts/update-herren-1-tabelle.js

      - name: Änderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/herren-1-tabelle.json
          git diff --cached --quiet || git commit -m "Herren-1-Tabelle automatisch aktualisiert"
          git push
